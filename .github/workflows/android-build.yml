name: Android debug APK

# Собирает debug APK при каждом пуше в main и по кнопке "Run workflow" вручную.
# Готовый файл появляется в разделе Actions → выбранный запуск → Artifacts.
# Это самый быстрый путь отдать актуальную сборку тестировщикам без локальной
# установки Android Studio / SDK на вашей машине.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      # google-services.json нельзя коммитить в репозиторий (в нём ключи проекта).
      # Кладём его как секрет GitHub в base64: см. инструкцию в README, раздел "CI/CD".
      - name: Restore google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
